name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/StorageTerm.Tests/StorageTerm.Tests.csproj -c Release

      - name: Publish self-contained build
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v', 'V')

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "A tag precisa ser vX.Y.Z (recebido: $tag)."
          }

          dotnet publish StorageTerm.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o publish `
            -p:Version=$version `
            -p:FileVersion="$version.0" `
            -p:DebugType=None `
            -p:DebugSymbols=false

          Get-ChildItem publish -Filter *.pdb -Recurse -ErrorAction SilentlyContinue |
            Remove-Item -Force

          Compress-Archive -Path "publish\*" -DestinationPath "StorageTerm-win-x64.zip" -CompressionLevel Optimal

          $hash = (Get-FileHash "StorageTerm-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "StorageTerm-win-x64.zip.sha256" -Value $hash -Encoding ascii

          Get-Item "StorageTerm-win-x64.zip", "StorageTerm-win-x64.zip.sha256" |
            Select-Object Name, Length

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "StorageTerm-win-x64.zip" `
            "StorageTerm-win-x64.zip.sha256" `
            --title "StorageTerm $tag" `
            --generate-notes
